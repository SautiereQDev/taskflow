# Docker Compose pour développement avec Tailwind v4 hot reload
services:
  db:
    image: postgres:18-alpine
    container_name: taskflow_dev_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_dev_password
      POSTGRES_DB: taskflow_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    container_name: taskflow_dev_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://taskflow:taskflow_dev_password@db:5432/taskflow_dev?schema=public"
      NODE_ENV: development
      SESSION_SECRET: dev_secret_change_in_production
      SESSION_MAX_AGE: 86400000
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: debug
      SEED_DATABASE: "true"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:ro
      - ./views:/app/views:ro
      - ./locales:/app/locales:ro
      - ./public/css:/app/public/css
      - ./public/js:/app/public/js:ro
      - ./public/images:/app/public/images:ro
      - ./prisma:/app/prisma:ro
      - ./CHANGELOG.md:/app/CHANGELOG.md:ro
      # Node modules from container (don't override)
      - /app/node_modules
      # Dist folder for built files
      - ./dist:/app/dist
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    # Override CMD to use dev:docker script (no --env-file flag)
    command: npm run dev:docker

volumes:
  postgres_data_dev:

networks:
  app-network:
    driver: bridge
