# Docker Compose for E2E Testing with Playwright
services:
  db:
    image: postgres:18-alpine
    container_name: taskflow_e2e_db
    restart: no
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_test_password
      POSTGRES_DB: taskflow_test
    volumes:
      - postgres_data_e2e:/var/lib/postgresql/data
    networks:
      - e2e-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: test
    container_name: taskflow_e2e_app
    restart: no
    environment:
      DATABASE_URL: "postgresql://taskflow:taskflow_test_password@db:5432/taskflow_test?schema=public"
      NODE_ENV: test
      SESSION_SECRET: test_secret_for_e2e
      SESSION_MAX_AGE: 86400000
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: warn
      SEED_DATABASE: "true"
      CI: "true"
    volumes:
      - ./src:/app/src:ro
      - ./views:/app/views:ro
      - ./locales:/app/locales:ro
      - ./prisma:/app/prisma:ro
      - /app/node_modules
      - /app/dist
      - /app/public
    networks:
      - e2e-network
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev:docker
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  e2e:
    image: mcr.microsoft.com/playwright:v1.48.2-noble
    container_name: taskflow_e2e_tests
    restart: no
    working_dir: /app
    environment:
      BASE_URL: "http://app:3000"
      CI: "true"
      HOME: /root
    volumes:
      - ./tests:/app/tests:ro
      - ./playwright.config.docker.ts:/app/playwright.config.docker.ts:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./node_modules:/app/node_modules:ro
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    networks:
      - e2e-network
    depends_on:
      app:
        condition: service_healthy
    command: npx playwright test --config=playwright.config.docker.ts

volumes:
  postgres_data_e2e:

networks:
  e2e-network:
    driver: bridge
